<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="LedgerLine">
  <!--
    The brand mark as a favicon: one tile from the hero's tessellation — the
    octagon with its interstitial square set inside.

    Redrawn as solid shapes rather than reusing the stroked <Mark>. That mark
    carries a 1.6px hairline on a 24-unit box; at a 16px favicon that stroke
    lands on well under a physical pixel and collapses into grey mush. Filling
    the octagon and knocking the square out of it keeps the same two shapes and
    the same interlock, at a contrast that survives being sixteen pixels wide.

    The dark tile behind it is deliberate: browser tab bars are light as often
    as dark, and brass alone on a light strip loses its edges.
  -->
  <rect width="32" height="32" rx="6" fill="#04060b" />
  <polygon
    points="28.32,21.11 21.11,28.32 10.89,28.32 3.68,21.11 3.68,10.89 10.89,3.68 21.11,3.68 28.32,10.89"
    fill="#e6b358"
  />
  <polygon points="21.87,16 16,21.87 10.13,16 16,10.13" fill="#04060b" />
</svg>
